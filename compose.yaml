services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: qrorder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qrorder}
      POSTGRES_USER: ${DB_USER:-qrorder}
      POSTGRES_PASSWORD: ${DB_PASS:-qrorder}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qrorder} -d ${DB_NAME:-qrorder}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: qrorder-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
