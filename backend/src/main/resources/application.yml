spring:
  application:
    name: qr-order-api

  # JPA — Flyway handles schema; JPA only validates
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
      jakarta:
        persistence:
          query:
            timeout: 5000 # 5s Query Timeout (Topik 13)

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # PostgreSQL datasource with HikariCP connection pool guards (Topik 27 & 38)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qrorder}
    username: ${DB_USER:qrorder}
    password: ${DB_PASS:qrorder}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 2000 # Warn on connections held > 2000ms

  # Redis Configuration (Topik 1, 2, 21, 40)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # Virtual threads (Java 21)
  threads:
    virtual:
      enabled: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

# Security — JWT (Topik 14, 24, 29)
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-dev}
    expiration-ms: ${JWT_EXPIRATION:3600000}   # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:86400000}  # 24 hours

# Actuator & Observability (Topik 19, 20, 22, 23)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Server
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Logging with MDC Context (Topik 19, 20)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}|outlet:%X{outletId:-}|order:%X{orderId:-}] %logger{36} - %msg%n"
  level:
    com.qrorder: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
